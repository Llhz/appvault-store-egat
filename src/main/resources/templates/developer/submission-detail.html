<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Submission Details')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
<div class="container py-4" style="max-width: 760px;">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a th:href="@{/developer/dashboard}" class="btn btn-link text-secondary p-0">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="page-title mb-0" th:text="${submission.name}">App Name</h1>
    </div>

    <div th:if="${param.submitted}" class="alert alert-success rounded-3 mb-3">
        Your app has been submitted for review!
    </div>

    <div class="bg-white rounded-3 shadow-sm p-4 mb-4">
        <!-- Status badge -->
        <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
                <h5 class="fw-bold mb-1" th:text="${submission.name}">App Name</h5>
                <p class="text-secondary mb-0" th:text="${submission.subtitle}"></p>
            </div>
            <span th:switch="${submission.status.name()}">
                <span th:case="'DRAFT'" class="badge bg-secondary fs-6">Draft</span>
                <span th:case="'PENDING_REVIEW'" class="badge bg-warning text-dark fs-6">Pending Review</span>
                <span th:case="'APPROVED'" class="badge bg-success fs-6">Approved</span>
                <span th:case="'REJECTED'" class="badge bg-danger fs-6">Rejected</span>
            </span>
        </div>

        <hr/>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="text-secondary small">Developer</div>
                <div th:text="${submission.developer ?: '-'}">-</div>
            </div>
            <div class="col-md-6">
                <div class="text-secondary small">Category</div>
                <div th:text="${submission.category != null ? submission.category.name : '-'}">-</div>
            </div>
            <div class="col-md-6">
                <div class="text-secondary small">Price</div>
                <div th:text="${submission.price.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 'Free' : '$' + #numbers.formatDecimal(submission.price, 1, 2)}">Free</div>
            </div>
            <div class="col-md-6">
                <div class="text-secondary small">Created</div>
                <div th:text="${#temporals.format(submission.createdAt, 'MMM d, yyyy HH:mm')}">-</div>
            </div>
            <div class="col-12" th:if="${submission.iconUrl != null}">
                <div class="text-secondary small mb-1">Icon</div>
                <img th:src="${submission.iconUrl}" th:alt="${submission.name}" width="80" height="80" class="rounded-3"/>
            </div>
            <div class="col-12">
                <div class="text-secondary small mb-1">Description</div>
                <p class="mb-0" style="white-space: pre-line;" th:text="${submission.description}">-</p>
            </div>
        </div>
    </div>

    <!-- Admin review notes (shown if rejected) -->
    <div th:if="${submission.status.name() == 'REJECTED'}" class="alert alert-danger rounded-3 mb-4">
        <h6 class="fw-semibold"><i class="fa-solid fa-circle-exclamation me-1"></i>Rejection Feedback</h6>
        <p class="mb-0" th:text="${submission.reviewNotes ?: 'No specific notes provided.'}">Notes</p>
    </div>

    <!-- Admin approval notes -->
    <div th:if="${submission.status.name() == 'APPROVED' and submission.reviewNotes != null}" class="alert alert-success rounded-3 mb-4">
        <h6 class="fw-semibold"><i class="fa-solid fa-circle-check me-1"></i>Admin Notes</h6>
        <p class="mb-0" th:text="${submission.reviewNotes}">Notes</p>
    </div>

    <!-- Actions -->
    <div class="d-flex gap-2">
        <!-- Submit for review (DRAFT) -->
        <form th:if="${submission.status.name() == 'DRAFT'}"
              th:action="@{/developer/submit/{id}/review(id=${submission.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-primary rounded-pill px-4">
                <i class="fa-solid fa-paper-plane me-1"></i>Submit for Review
            </button>
        </form>

        <!-- Resubmit (REJECTED) -->
        <form th:if="${submission.status.name() == 'REJECTED'}"
              th:action="@{/developer/submit/{id}/review(id=${submission.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-warning rounded-pill px-4">
                <i class="fa-solid fa-rotate me-1"></i>Resubmit for Review
            </button>
        </form>

        <!-- View approved listing -->
        <a th:if="${submission.status.name() == 'APPROVED' and submission.approvedListingId != null}"
           th:href="@{/app/{id}(id=${submission.approvedListingId})}"
           class="btn btn-success rounded-pill px-4">
            <i class="fa-solid fa-arrow-up-right-from-square me-1"></i>View App Listing
        </a>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
