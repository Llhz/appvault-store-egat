<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Developer Dashboard')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="page-title mb-0"><i class="fa-solid fa-code me-2 text-primary"></i>Developer Dashboard</h1>
        <a th:href="@{/developer/submit}" class="btn btn-primary rounded-pill px-4">
            <i class="fa-solid fa-plus me-1"></i>Submit New App
        </a>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
            <div class="stat-card">
                <div class="stat-icon bg-primary-light"><i class="fa-solid fa-layer-group text-primary fa-xl"></i></div>
                <div class="stat-value" th:text="${totalCount}">0</div>
                <div class="stat-label">Total Submissions</div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="stat-card">
                <div class="stat-icon" style="background:#f5f5f5;"><i class="fa-solid fa-file-pen fa-xl" style="color:#6c757d;"></i></div>
                <div class="stat-value" th:text="${draftCount}">0</div>
                <div class="stat-label">Drafts</div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="stat-card">
                <div class="stat-icon bg-warning-light"><i class="fa-solid fa-clock text-warning fa-xl"></i></div>
                <div class="stat-value" th:text="${pendingCount}">0</div>
                <div class="stat-label">Pending Review</div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3">
            <div class="stat-card">
                <div class="stat-icon bg-success-light"><i class="fa-solid fa-circle-check text-success fa-xl"></i></div>
                <div class="stat-value" th:text="${approvedCount}">0</div>
                <div class="stat-label">Approved</div>
            </div>
        </div>
    </div>

    <!-- Submissions Table -->
    <div class="bg-white rounded-3 shadow-sm p-4">
        <h5 class="fw-semibold mb-3">My Submissions</h5>

        <div th:if="${submissions.isEmpty()}" class="text-center text-secondary py-5">
            <i class="fa-solid fa-inbox fa-3x mb-3 d-block"></i>
            <p>No submissions yet. <a th:href="@{/developer/submit}">Submit your first app!</a></p>
        </div>

        <div class="table-responsive" th:unless="${submissions.isEmpty()}">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>App</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Submitted</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                <tr th:each="sub : ${submissions}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <img th:if="${sub.iconUrl != null}" th:src="${sub.iconUrl}" th:alt="${sub.name}"
                                 width="40" height="40" class="rounded-3"/>
                            <i th:unless="${sub.iconUrl != null}" class="fa-solid fa-rocket fa-xl text-secondary"></i>
                            <div>
                                <div class="fw-semibold" th:text="${sub.name}">App Name</div>
                                <div class="text-secondary small" th:text="${sub.subtitle}"></div>
                            </div>
                        </div>
                    </td>
                    <td class="text-secondary" th:text="${sub.category != null ? sub.category.name : '-'}">-</td>
                    <td>
                        <span th:switch="${sub.status.name()}">
                            <span th:case="'DRAFT'" class="badge bg-secondary">Draft</span>
                            <span th:case="'PENDING_REVIEW'" class="badge bg-warning text-dark">Pending Review</span>
                            <span th:case="'APPROVED'" class="badge bg-success">Approved</span>
                            <span th:case="'REJECTED'" class="badge bg-danger">Rejected</span>
                        </span>
                    </td>
                    <td class="text-secondary small" th:text="${#temporals.format(sub.createdAt, 'MMM d, yyyy')}">-</td>
                    <td>
                        <a th:href="@{/developer/submission/{id}(id=${sub.id})}" class="btn btn-sm btn-outline-primary rounded-pill">View</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
