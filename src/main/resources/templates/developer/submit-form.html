<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Submit an App')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
<div class="container py-4" style="max-width: 760px;">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a th:href="@{/developer/dashboard}" class="btn btn-link text-secondary p-0">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="page-title mb-0">Submit a New App</h1>
    </div>

    <div class="bg-white rounded-3 shadow-sm p-4">
        <form th:action="@{/developer/submit}" method="post" th:object="${submissionDto}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
                <label class="form-label fw-semibold">App Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control rounded-3" th:field="*{name}" required maxlength="100"
                       placeholder="e.g. MyAwesomeApp"/>
                <div class="text-danger small mt-1" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Subtitle</label>
                <input type="text" class="form-control rounded-3" th:field="*{subtitle}" maxlength="200"
                       placeholder="Short tagline for your app"/>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
                <textarea class="form-control rounded-3" th:field="*{description}" rows="6" required maxlength="5000"
                          placeholder="Describe your app, its features, and what makes it unique..."></textarea>
                <div class="text-danger small mt-1" th:errors="*{description}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Developer / Company Name</label>
                <input type="text" class="form-control rounded-3" th:field="*{developer}" maxlength="200"
                       placeholder="e.g. Acme Corp"/>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Icon URL</label>
                <input type="url" class="form-control rounded-3" th:field="*{iconUrl}"
                       placeholder="https://example.com/icon.png"/>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Price (USD)</label>
                    <input type="number" class="form-control rounded-3" th:field="*{price}"
                           min="0" step="0.01" placeholder="0.00"/>
                    <div class="text-danger small mt-1" th:errors="*{price}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Category</label>
                    <select class="form-select rounded-3" th:field="*{categoryId}">
                        <option value="">-- Select a category --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                    </select>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary rounded-pill px-4">
                    <i class="fa-solid fa-floppy-disk me-1"></i>Save as Draft
                </button>
                <a th:href="@{/developer/dashboard}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
