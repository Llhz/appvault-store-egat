<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Review Submission')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
<div class="container py-4" style="max-width: 800px;">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a th:href="@{/admin/submissions}" class="btn btn-link text-secondary p-0">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="page-title mb-0">Review Submission</h1>
    </div>

    <div th:if="${param.errorReject}" class="alert alert-danger rounded-3 mb-3">
        Rejection reason is required. Please provide feedback for the developer.
    </div>

    <!-- Submission Preview -->
    <div class="bg-white rounded-3 shadow-sm p-4 mb-4">
        <div class="d-flex gap-3 align-items-start mb-3">
            <img th:if="${submission.iconUrl != null}" th:src="${submission.iconUrl}" th:alt="${submission.name}"
                 width="80" height="80" class="rounded-3 flex-shrink-0"/>
            <i th:unless="${submission.iconUrl != null}" class="fa-solid fa-rocket fa-3x text-secondary flex-shrink-0"></i>
            <div>
                <h4 class="fw-bold mb-1" th:text="${submission.name}">App Name</h4>
                <p class="text-secondary mb-1" th:text="${submission.subtitle}"></p>
                <span class="badge bg-warning text-dark">Pending Review</span>
            </div>
        </div>

        <hr/>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <div class="text-secondary small">Developer</div>
                <div th:text="${submission.developer ?: '-'}">-</div>
            </div>
            <div class="col-md-4">
                <div class="text-secondary small">Category</div>
                <div th:text="${submission.category != null ? submission.category.name : '-'}">-</div>
            </div>
            <div class="col-md-4">
                <div class="text-secondary small">Price</div>
                <div th:text="${submission.price.compareTo(T(java.math.BigDecimal).ZERO) == 0 ? 'Free' : '$' + #numbers.formatDecimal(submission.price, 1, 2)}">Free</div>
            </div>
            <div class="col-md-4">
                <div class="text-secondary small">Submitted By</div>
                <div th:text="${submission.submitter.fullName}">User</div>
            </div>
            <div class="col-md-4">
                <div class="text-secondary small">Date</div>
                <div th:text="${#temporals.format(submission.createdAt, 'MMM d, yyyy HH:mm')}">-</div>
            </div>
        </div>

        <div>
            <div class="text-secondary small mb-1">Description</div>
            <p style="white-space: pre-line;" th:text="${submission.description}">-</p>
        </div>
    </div>

    <!-- Approve / Reject forms -->
    <div class="row g-4">
        <div class="col-md-6">
            <div class="bg-white rounded-3 shadow-sm p-4 h-100">
                <h6 class="fw-semibold text-success mb-3"><i class="fa-solid fa-circle-check me-1"></i>Approve</h6>
                <form th:action="@{/admin/submissions/{id}/approve(id=${submission.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label small">Notes for developer (optional)</label>
                        <textarea class="form-control rounded-3" name="reviewNotes" rows="3"
                                  placeholder="Congratulations! Your app is live..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-success rounded-pill px-4 w-100"
                            onclick="return confirm('Approve this submission and create an app listing?')">
                        <i class="fa-solid fa-circle-check me-1"></i>Approve &amp; Publish
                    </button>
                </form>
            </div>
        </div>
        <div class="col-md-6">
            <div class="bg-white rounded-3 shadow-sm p-4 h-100">
                <h6 class="fw-semibold text-danger mb-3"><i class="fa-solid fa-circle-xmark me-1"></i>Reject</h6>
                <form th:action="@{/admin/submissions/{id}/reject(id=${submission.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label class="form-label small">Reason for rejection <span class="text-danger">*</span></label>
                        <textarea class="form-control rounded-3" name="reviewNotes" rows="3" required
                                  placeholder="Please describe why this submission was rejected..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-danger rounded-pill px-4 w-100"
                            onclick="return confirm('Reject this submission?')">
                        <i class="fa-solid fa-circle-xmark me-1"></i>Reject Submission
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
