<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head('Submission Queue')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<main style="padding-top: 70px;">
<div class="container py-4">
    <h1 class="page-title mb-4"><i class="fa-solid fa-inbox me-2 text-warning"></i>Submission Queue</h1>

    <div th:if="${param.approved}" class="alert alert-success rounded-3 mb-3">Submission approved successfully!</div>
    <div th:if="${param.rejected}" class="alert alert-danger rounded-3 mb-3">Submission rejected.</div>

    <div class="bg-white rounded-3 shadow-sm p-4">
        <div th:if="${submissions.isEmpty()}" class="text-center text-secondary py-5">
            <i class="fa-solid fa-circle-check fa-3x mb-3 d-block text-success"></i>
            <p class="mb-0">No pending submissions. All clear!</p>
        </div>

        <div class="table-responsive" th:unless="${submissions.isEmpty()}">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>App</th>
                        <th>Developer</th>
                        <th>Submitted By</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                <tr th:each="sub : ${submissions}">
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <img th:if="${sub.iconUrl != null}" th:src="${sub.iconUrl}" th:alt="${sub.name}"
                                 width="40" height="40" class="rounded-3"/>
                            <i th:unless="${sub.iconUrl != null}" class="fa-solid fa-rocket fa-xl text-secondary"></i>
                            <div>
                                <div class="fw-semibold" th:text="${sub.name}">App</div>
                                <div class="text-secondary small" th:text="${sub.subtitle}"></div>
                            </div>
                        </div>
                    </td>
                    <td class="text-secondary" th:text="${sub.developer ?: '-'}">-</td>
                    <td class="text-secondary" th:text="${sub.submitter.fullName}">User</td>
                    <td class="text-secondary small" th:text="${#temporals.format(sub.createdAt, 'MMM d, yyyy')}">-</td>
                    <td>
                        <a th:href="@{/admin/submissions/{id}(id=${sub.id})}" class="btn btn-sm btn-primary rounded-pill">
                            Review
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</main>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
